[project]
name = "smallest-qa"
version = "0.1.0"
description = "Bounded, evidence-driven QA harness for Smallest AI Lightning TTS and Pulse STT APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "tzdata>=2024.1",
]

[project.scripts]
smallest-qa = "smallest_qa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]
# Official SDK + libraries used only for SDK-compatibility and doc-example checks (Phase 2).
sdk = [
    "smallestai==5.14.0",
    "requests>=2.31",
    "websockets>=12",
]

[tool.uv]
default-groups = ["dev", "sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smallest_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: performs authenticated network requests (never run by default)",
]
